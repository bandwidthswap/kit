<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bwkit</title>
<style>
/* The node's own dashboard, served by bwkit at / on the node's HTTP port and read on the LAN or the tailnet.
   Works offline: no fonts or scripts from anywhere else. One page for every role; the sections a role has are drawn,
   the rest are not. Layout: a status bar, a "now" strip, then the books in the order an operator reads them. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#161c18; --muted:#5f6a62; --line:#d6dbd5; --soft:#e9ede8;
  --accent:#1d6a58; --accent-ink:#ffffff; --ok:#1d6a58; --warn:#b9561c; --bad:#a3302a; --info:#2b5f9e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121715; --panel:#181f1c; --fg:#e6ebe6; --muted:#9aa89e; --line:#2a3430; --soft:#1f2824;
  --accent:#5fc3a6; --accent-ink:#0f1a16; --ok:#5fc3a6; --warn:#e8955a; --bad:#ef8a84; --info:#7fb0ea; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121715; --panel:#181f1c; --fg:#e6ebe6; --muted:#9aa89e; --line:#2a3430; --soft:#1f2824;
  --accent:#5fc3a6; --accent-ink:#0f1a16; --ok:#5fc3a6; --warn:#e8955a; --bad:#ef8a84; --info:#7fb0ea; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.bar{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.bar .name{font-weight:700;font-size:18px;letter-spacing:.01em}
.bar .role{font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:4px;padding:2px 7px;text-transform:uppercase;letter-spacing:.08em}
.bar .nym,.bar .v{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.bar .spacer{flex:1}
.bar .snap{font-size:12px;color:var(--warn);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 56px}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px;display:flex;gap:12px;align-items:baseline}
h2 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:13px}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.now div{background:var(--panel);padding:10px 12px;min-width:0}
.now .k{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.now .v{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.now .s{display:block;font-size:12px;color:var(--muted)}
.now .ok .v{color:var(--ok)} .now .warn .v{color:var(--warn)} .now .bad .v{color:var(--bad)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.m{font-family:var(--mono);font-size:12px}
td.w{white-space:normal;min-width:18ch}
tbody tr:last-child td{border-bottom:0}
tr.sum td{font-weight:600;border-top:2px solid var(--line);background:var(--soft)}
.st{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:#fff}
.st.settled{background:var(--ok);color:var(--accent-ink)} .st.disputed{background:var(--warn)} .st.open{background:var(--info)} .st.closed{background:var(--muted)} .st.pending{background:var(--warn)} .st.declined{background:var(--bad)}
.strip{display:flex;gap:2px;align-items:flex-end;height:54px;padding:6px 0 0}
.strip i{display:block;flex:1;min-width:3px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.strip i.disputed{background:var(--warn)} .strip i.none{background:var(--line);height:2px!important}
.legend{font-size:12px;color:var(--muted);margin:4px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin:6px 0 0;max-width:80ch}
.empty{color:var(--muted);padding:14px;background:var(--panel);border:1px dashed var(--line);border-radius:8px}
code{font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:3px;padding:0 4px}
a{color:var(--accent)}
.err{background:var(--bad);color:#fff;padding:8px 12px;border-radius:6px;margin:0 0 12px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 6px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted);margin:4px 0 0}
svg .ax{font-size:11px;fill:var(--muted);font-family:var(--mono)} svg .lbl{font-size:12px;fill:var(--fg);font-family:var(--sans)} svg .lbl.m{font-family:var(--mono);font-size:11px}
svg .grid{stroke:var(--line);stroke-width:1} svg .zero{stroke:var(--muted);stroke-width:1} svg .band{fill:var(--accent);opacity:.13}
svg .bar{fill:var(--accent)} svg .bar.disputed{stroke:var(--warn);stroke-width:1.5} svg .dot{fill:var(--accent)} svg .dot.disputed{fill:var(--warn)}
svg .mean{stroke:var(--fg);stroke-dasharray:4 3;stroke-width:1} svg .min{stroke:var(--info);stroke-dasharray:3 3;stroke-width:1.5}
svg .place{fill:var(--soft);stroke:var(--line);stroke-width:1.5} svg .place.wanted{stroke:var(--info);stroke-dasharray:5 4}
svg .node{fill:var(--accent)} svg .link{stroke:var(--accent);fill:none;stroke-linecap:round;opacity:.8} svg .offer{stroke:var(--info);stroke-dasharray:6 4;fill:none;stroke-width:2}
svg .tick{stroke:var(--fg);stroke-width:2} svg .tick.steward{stroke:var(--info)} svg .tick.now{stroke:var(--warn);stroke-width:2.5}
svg .span{fill:var(--accent);opacity:.25} svg .span.after{fill:var(--info);opacity:.15}
svg .block{fill:var(--accent)} svg .block.missing{fill:none;stroke:var(--bad);stroke-width:1.5} svg .block.none{fill:var(--line)}
svg .seg.relay{fill:var(--accent)} svg .seg.fee{fill:var(--warn)} svg .seg.premium{fill:var(--info)}
svg .chip rect{fill:var(--panel);stroke:var(--line);stroke-width:1} svg .chip text{font-size:11px;font-family:var(--mono);fill:var(--fg)} svg .chip.offer rect{stroke:var(--info);stroke-dasharray:4 3} svg .chip.offer text{fill:var(--info)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px;margin-top:3px} .pb i{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){ .bar .name{font-size:16px} .now .v{font-size:17px} }
</style>
</head>
<body>
<header class="bar">
  <span class="name" id="h-name">bwkit</span>
  <span class="role" id="h-role">node</span>
  <span class="nym" id="h-nym"></span>
  <span class="v" id="h-ver"></span>
  <span class="spacer"></span>
  <span class="snap" id="h-snap" hidden>snapshot</span>
  <span class="v" id="h-at"></span>
</header>
<main id="main">
  <div class="err" id="err" hidden></div>
  <div id="sections"></div>
</main>

<script id="snapshot" type="application/json"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var H = 3600;

  // ------------------------------------------------------------------ formatting
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pad(n){ return (n<10?'0':'')+n; }
  function tstamp(t){ if(!t) return '–'; var d=new Date(t*1000); return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hm(t){ var d=new Date(t*1000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function ago(t, now){ if(!t) return 'never'; var s=Math.max(0, now-t); if(s<90) return s+' s ago'; if(s<5400) return Math.round(s/60)+' min ago'; if(s<172800) return (s/3600).toFixed(1)+' h ago'; return Math.round(s/86400)+' d ago'; }
  function bytes(n){ if(n==null) return '–'; if(n>=1e9) return (n/1e9).toFixed(2)+' GB'; if(n>=1e6) return (n/1e6).toFixed(2)+' MB'; if(n>=1e3) return (n/1e3).toFixed(1)+' kB'; return n+' B'; }
  function usd(x){ if(x==null) return '–'; var a=Math.abs(x); return (x<0?'−':'')+'$'+(a===0?'0.0000':a>=0.001?a.toFixed(4):a.toFixed(6)); }
  function pct(x, d){ return (100*x).toFixed(d==null?1:d)+'%'; }
  function short(nym){ return nym ? nym.replace(/^ed25519:/,'').slice(0,8)+'…' : '–'; }
  function sortBy(arr, key, desc){ return arr.slice().sort(function(a,b){ var x=key(a), y=key(b); return x<y ? (desc?1:-1) : x>y ? (desc?-1:1) : 0; }); }

  // ------------------------------------------------------------------ data
  var D = { status:null, ledger:[], commitments:[], purchases:[], steward:null, map:null, snapshot:false, fetchedAt:0 };

  function parseJsonl(text){ var out=[]; text.split('\n').forEach(function(l){ l=l.trim(); if(!l) return; try{ out.push(JSON.parse(l)); }catch(e){} }); return out; }

  function loadSnapshot(){
    var el=$('snapshot'); if(!el || !el.textContent.trim()) return false;
    var s=JSON.parse(el.textContent);
    D.status=s.status; D.ledger=typeof s.ledger==='string'?parseJsonl(s.ledger):(s.ledger||[]); D.commitments=s.commitments||[];
    D.purchases=typeof s.purchases==='string'?parseJsonl(s.purchases):(s.purchases||[]); D.steward=s.steward||null; D.map=s.map||null;
    D.snapshot=true; D.fetchedAt=s.taken_at||(s.status&&s.status.time)||0; return true;
  }
  function get(path, text){ return fetch(path,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(path+' '+r.status); return text?r.text():r.json(); }); }
  function loadLive(){
    var opt=function(p, text, dflt){ return get(p, text).catch(function(){ return dflt; }); };
    return Promise.all([ get('/status'), get('/ledger', true), opt('/commitments', false, []), opt('/purchases', true, ''), opt('/steward', false, null), opt('/map', false, null) ])
      .then(function(r){ D.status=r[0]; D.ledger=parseJsonl(r[1]); D.commitments=r[2]||[]; D.purchases=typeof r[3]==='string'?parseJsonl(r[3]):(r[3]||[]); D.steward=r[4]; D.map=r[5]; D.fetchedAt=Math.floor(Date.now()/1000); });
  }

  // ------------------------------------------------------------------ derived
  var NOW=0;   // the moment the page is drawn for: the snapshot's time, or now
  function derive(){
    var st=D.status||{}, L=D.ledger;
    var names={};                                         // NYM -> name, from the records that carry both
    L.forEach(function(e){ if(e.kind==='receipt'&&e.receipt) names[e.receipt.payer]=e.from; if(e.kind==='ack'&&e.receipt) names[e.receipt.hop]=e.from; });
    if(st.nym) names[st.nym]=st.name;
    if(st.steward) names[st.steward]='steward';
    var place={}; if(D.map&&D.map.nodes) for(var k in D.map.nodes) place[k]=D.map.nodes[k];
    var name=function(nym){ return names[nym]||short(nym); };
    var S=L.filter(function(e){ return e.kind==='settlement'; });
    var R=L.filter(function(e){ return e.kind==='receipt'; }), A=L.filter(function(e){ return e.kind==='ack'; });
    var C=(D.commitments&&D.commitments.length?D.commitments:L.filter(function(e){ return e.kind==='commitment'; }));
    var key=function(r){ return r.payer+'|'+r.hop+'|'+r.t_first; };
    var acked={}; A.forEach(function(a){ acked[key(a.receipt)]=a; });
    var settledKey={}; S.forEach(function(s){ settledKey[key(s)]=s; });
    var pending=R.filter(function(r){ return !settledKey[key(r.receipt)]; }).map(function(r){ return {r:r, ack:acked[key(r.receipt)]||null, lost: (NOW-r.received_at)>2*H}; });
    var links={}; S.forEach(function(s){ var k=s.payer+'>'+s.hop; (links[k]=links[k]||{payer:s.payer,hop:s.hop,windows:[]}).windows.push(s); });
    var lastSeen={}; R.concat(A).forEach(function(e){ if(e.from&&e.received_at) lastSeen[e.from]=Math.max(lastSeen[e.from]||0, e.received_at); });
    var peers={};
    for(var n in names){ var nm=names[n]; if(nm==='steward'||n===st.nym) continue; peers[n]={nym:n,name:nm,roles:{},windows:0,lastSeen:lastSeen[nm]||0,place:place[nm]||null}; }
    S.forEach(function(s){ if(peers[s.payer]){ peers[s.payer].roles.payer=1; peers[s.payer].windows++; } if(peers[s.hop]){ peers[s.hop].roles.hop=1; peers[s.hop].windows++; } });
    var paidOn={}; S.forEach(function(s){ if(s.purchase){ var p=paidOn[s.purchase]=paidOn[s.purchase]||{premium:0,refund:0,windows:0,steward:0}; p.premium+=s.premium_usd||0; p.refund+=s.refund_usd||0; p.steward+=s.from_steward_usd||0; p.windows++; } });
    // the purchases file holds three kinds of record: the purchases, and the top-ups and closes their posters append (spec, Section 15)
    var topups={}, closedAt={};
    (D.purchases||[]).forEach(function(r){ if(r.kind==='top-up') topups[r.purchase]=(topups[r.purchase]||0)+(r.escrow||0); if(r.kind==='close'&&closedAt[r.purchase]==null) closedAt[r.purchase]=r.posted_at; });
    var purchases=(D.purchases||[]).filter(function(r){ return !r.kind||r.kind==='purchase'; });
    return { st:st, names:names, name:name, S:S, R:R, A:A, C:C, pending:pending, links:links, peers:peers, paidOn:paidOn, place:place, purchases:purchases, topups:topups, closedAt:closedAt };
  }

  // ------------------------------------------------------------------ sections
  function nowStrip(X, now){
    var st=X.st, cells=[];
    var up = st.time ? (now - st.time) : null;
    cells.push({k:'service', v: D.snapshot?'snapshot':(up!=null&&up<120?'up':'stale'), s: st.time?('answered '+ago(st.time, now)):'no status', cls: D.snapshot?'':(up!=null&&up<120?'ok':'bad')});
    var lastR = X.R.length ? X.R[X.R.length-1].received_at : 0;
    cells.push({k:'last receipt', v: lastR?hm(lastR):'–', s: lastR?(ago(lastR, now)+', from '+esc(X.R[X.R.length-1].from)):'none yet', cls: lastR&&(now-lastR)>2*H?'warn':''});
    var rw = X.pending.filter(function(p){ return !p.ack && !p.lost; }).length, lost = X.pending.filter(function(p){ return p.lost; }).length;
    cells.push({k:'waiting for an ack', v: String(rw), s: (rw?('receipt'+(rw>1?'s':'')+' without a hop\'s countersignature'):'nothing pending')+(lost?' · '+lost+' lost window'+(lost>1?'s':''):''), cls: rw>1?'warn':''});
    var disputed = X.S.filter(function(s){ return s.status==='disputed'; }).length;
    cells.push({k:'windows settled', v: String(X.S.length), s: disputed+' disputed · '+X.C.length+' commitment'+(X.C.length===1?'':'s'), cls:''});
    var nextCommit = (Math.floor(now/H)+1)*H;
    cells.push({k:'next commitment', v: hm(nextCommit), s: 'the hour closes and is signed at the top of the hour', cls:''});
    var drift = (st.time && !D.snapshot) ? (D.fetchedAt - st.time) : null;
    cells.push({k:'clock', v: st.clock_offset_s!=null ? (Math.abs(st.clock_offset_s)<0.5 ? (st.clock_offset_s*1000).toFixed(1)+' ms' : st.clock_offset_s.toFixed(2)+' s') : (drift!=null?(drift+' s'):'–'), s: st.clock_offset_s!=null?('against its time source, stratum '+(st.stratum||'?')):'the node\'s time against this browser\'s', cls: st.clock_offset_s!=null&&Math.abs(st.clock_offset_s)>1?'bad':''});
    if(st.disk_free_bytes!=null) cells.push({k:'disk free', v: bytes(st.disk_free_bytes), s:'for the ledger', cls: st.disk_free_bytes<5e8?'bad':''});
    if(st.last_report_at!=null) cells.push({k:'status posted', v: ago(st.last_report_at, now), s:'to the public feed', cls:(now-st.last_report_at)>600?'warn':''});
    return '<h2>Now <small>as the node sees it</small></h2><div class="now">'+cells.map(function(c){ return '<div class="'+c.cls+'"><span class="k">'+c.k+'</span><span class="v">'+esc(c.v)+'</span><span class="s">'+c.s+'</span></div>'; }).join('')+'</div>';
  }

  // What needs attention: the rules the operator would otherwise check by hand, in the order they matter.
  function attention(X, now){
    var st=X.st, items=[];
    if(!D.snapshot && st.time && now-st.time>120) items.push(['bad','The node\'s status is '+ago(st.time, now)+'; the service may be down.']);
    if(st.clock_offset_s!=null && Math.abs(st.clock_offset_s)>1) items.push(['bad','The clock is '+st.clock_offset_s.toFixed(2)+' s off its source; receipts are declined beyond the link\'s tolerance.']);
    if(st.disk_free_bytes!=null && st.disk_free_bytes<5e8) items.push(['bad','Only '+bytes(st.disk_free_bytes)+' of disk is free for the ledger.']);
    var hours={}; X.S.forEach(function(s){ var w=Math.floor(s.t_first/H)*H; (hours[w]=hours[w]||[]).push(s); });
    var committed={}; X.C.forEach(function(c){ committed[c.window]=c; });
    var cur=Math.floor(now/H)*H;
    var firstC=X.C.length?Math.min.apply(null, X.C.map(function(c){ return c.window; })):Infinity;   // hours before the Mint began committing are not missing anything
    Object.keys(hours).map(Number).sort().forEach(function(w){ if(w>=firstC && w<cur && !committed[w] && now-w>H+300) items.push(['bad','The '+tstamp(w)+' hour has '+hours[w].length+' settlement'+(hours[w].length===1?'':'s')+' and no commitment.']); });
    X.pending.forEach(function(p){ if(!p.ack && !p.lost && now-p.r.received_at>600) items.push(['warn','A receipt from '+esc(p.r.from)+' for the '+tstamp(p.r.receipt.t_first)+' window has waited '+ago(p.r.received_at, now).replace(' ago','')+' for the hop\'s countersignature.']); });
    if(X.R.length && now-X.R[X.R.length-1].received_at>2*H) items.push(['warn','No receipt for '+ago(X.R[X.R.length-1].received_at, now).replace(' ago','')+'; one is due at the top of every hour.']);
    if(st.last_report_at!=null && now-st.last_report_at>600) items.push(['warn','The public status was last posted '+ago(st.last_report_at, now)+'.']);
    var inForce={}; (st.links||[]).forEach(function(l){ inForce[l.relay]=l; });
    for(var k in X.links){ var l=X.links[k], W=sortBy(l.windows, function(s){ return s.t_first; }, true).slice(0,24); if(W.length<3) continue;
      var m=inForce[l.hop]?inForce[l.hop].margin:0.01, gaps=W.map(function(s){ return s.payer_bytes?(s.hop_bytes-s.payer_bytes)/s.payer_bytes:0; }), mean=gaps.reduce(function(a,b){ return a+b; },0)/gaps.length;
      var beyond=W.filter(function(s){ return s.status==='disputed'; }).length;
      if(mean>m) items.push(['warn',esc(X.name(l.payer))+' → '+esc(X.name(l.hop))+': the gap runs at '+(mean>=0?'+':'')+pct(mean)+' over the last '+W.length+' windows against a margin of '+pct(m,0)+', so '+beyond+' of them settled disputed; raise the margin in the link\'s announcement or mend the path.']); }
    var openFirst={}; X.purchases.forEach(function(p){ if(p.program==='first_link'&&p.deadline>=now&&!(X.closedAt[p.id]!=null&&X.closedAt[p.id]<=now)){ openFirst[p.route.to]=(openFirst[p.route.to]||0)+1; } });
    Object.keys(openFirst).forEach(function(k){ if(openFirst[k]>1) items.push(['warn',openFirst[k]+' first-link offers are open for '+esc(k)+'; the rule should hold one standing offer and top it up.']); });
    if(!items.length) return '<h2>Attention</h2><div class="now"><div class="ok"><span class="k">nothing</span><span class="v">all clear</span><span class="s">every check this page knows passes</span></div></div>';
    return '<h2>Attention <small>'+items.length+' item'+(items.length===1?'':'s')+'</small></h2><div class="cards">'+items.map(function(i){ return '<div class="card" style="border-left:4px solid var(--'+i[0]+')">'+i[1]+'</div>'; }).join('')+'</div>';
  }

  function pendingTable(X, now){
    if(!X.pending.length) return '';

  function windowsTable(X){

  }

  function linkStrips(X, now){
    var out='';

      var l=X.links[k], by={}; l.windows.forEach(function(s){ by[Math.floor(s.t_first/H)*H]=s; });
      var end=Math.floor(now/H)*H, bars=[], max=1;
      for(var h=end-47*H; h<=end; h+=H){ var s=by[h]; if(s&&s.settled_bytes>max) max=s.settled_bytes; bars.push(s||null); }
      var gaps=l.windows.map(function(s){ return s.payer_bytes?(s.hop_bytes-s.payer_bytes)/s.payer_bytes:0; });
      var mean=gaps.reduce(function(a,b){ return a+b; },0)/gaps.length, lo=Math.min.apply(null,gaps), hi=Math.max.apply(null,gaps);
      var disputed=l.windows.filter(function(s){ return s.status==='disputed'; }).length;
      var paid=l.windows.reduce(function(a,s){ return a+(s.amount_usd||0); },0), fee=l.windows.reduce(function(a,s){ return a+(s.fee_usd||0); },0);
      out+='<div class="card"><h3>'+esc(X.name(l.payer))+' → '+esc(X.name(l.hop))+' <small class="note" style="margin:0">'+l.windows.length+' windows · '+disputed+' disputed · '+usd(paid)+' paid, '+usd(fee)+' of it the Steward\'s</small></h3>'+
        '<div class="strip">'+bars.map(function(s){ return s ? '<i class="'+s.status+'" style="height:'+Math.max(4,Math.round(48*s.settled_bytes/max))+'px" title="'+tstamp(s.t_first)+' '+bytes(s.settled_bytes)+' '+s.status+'"></i>' : '<i class="none"></i>'; }).join('')+'</div>'+
        '<p class="legend">the last 48 hours, settled bytes per window; orange is disputed · gap hop over payer: mean '+(mean>=0?'+':'')+pct(mean)+', from '+pct(lo)+' to '+pct(hi)+'</p></div>';
    }
    return out ? '<h2>Links <small>as settled</small></h2><div class="cards">'+out+'</div>' : '';
  }

  function commitmentsTable(X){

  function linksAnnounced(X){

    });

  }

  function stewardCard(X, now){

      [['income', usd(s.income_usd), 'f = '+pct(s.f,0)+' of every fee'],['in open offers', usd(s.in_offers_usd!=null?s.in_offers_usd:s.posted_usd), ''],['escrow', usd(s.escrow_usd), 'unposted'],['match reserve', usd(s.reserve_usd), 'm = '+pct(s.m,0)+' of income'],['paid out', usd(s.paid_usd), 'against receipts'],['returned', usd(s.refunded_usd), 'to the escrow'],['held by the cap', usd(s.held_by_cap_usd), 'f − '+pct(s.margin,0)+' per payer'],['last run', last?ago(last, now):'never', last?tstamp(last):'']]
      .map(function(c){ return '<div><span class="k">'+c[0]+'</span><span class="v">'+esc(c[1])+'</span><span class="s">'+esc(c[2])+'</span></div>'; }).join('')+'</div>'+
      (s.skipped&&s.skipped.length?'<p class="note">Last run skipped: '+s.skipped.map(esc).join('; ')+'.</p>':'')+

  function invoiceTable(X, now){
    var d=new Date(now*1000), month=d.getFullYear()+'-'+pad(d.getMonth()+1), by={};
    X.S.forEach(function(s){ var e=new Date(s.t_last*1000); if(e.getFullYear()+'-'+pad(e.getMonth()+1)!==month) return; var k=s.payer+'|'+s.hop; var o=by[k]=by[k]||{payer:s.payer,hop:s.hop,windows:0,disputed:0,bytes:0,amount:0,fee:0,premium:0,refund:0,fromSteward:0}; o.windows++; if(s.status==='disputed') o.disputed++; o.bytes+=s.settled_bytes; o.amount+=s.amount_usd||0; o.fee+=s.fee_usd||0; o.premium+=s.premium_usd||0; o.refund+=s.refund_usd||0; o.fromSteward+=s.from_steward_usd||0; });
    var rows=Object.keys(by).map(function(k){ return by[k]; }); if(!rows.length) return '';

    html+='<tr class="sum"><td>'+month+'</td><td></td><td></td><td class="n">'+usd(ta)+'</td><td class="n">'+usd(tp)+'</td><td class="n">'+usd(ta-tf+tp)+'</td><td class="n">'+usd(tf)+'</td></tr>';
    return '<h2>Invoice <small>'+month+', the month so far, as <code>bwkit invoice</code> sums it</small></h2><div class="tbl"><table><thead><tr><th>pair</th><th class="n">windows</th><th class="n">settled</th><th class="n">carriage</th><th class="n">premium</th><th class="n">the relay\'s</th><th class="n">the Steward\'s</th></tr></thead><tbody>'+html+'</tbody></table></div>';
  }

    var m=D.map; if(!m||!m.places) return '';
    var byPlace={}; for(var n in (m.nodes||{})) (byPlace[m.nodes[n]]=byPlace[m.nodes[n]]||[]).push(n);
    var rows=Object.keys(m.places).map(function(id){ var p=m.places[id]; return '<tr><td>'+esc(p.name||id)+((p.name&&p.name!==id)?' <span class="m">'+esc(id)+'</span>':'')+'</td><td>'+esc(p.domain)+'</td><td>'+esc(p.medium)+' · '+esc(p.range_class)+'</td><td>'+(p.mapped?'mapped':'proposed')+'</td><td>'+esc((byPlace[id]||[]).join(', ')||'none')+'</td></tr>'; });
    return '<h2>The map <small>places by Mint consensus; here, the membership\'s file</small></h2><div class="tbl"><table><thead><tr><th>place</th><th>domain</th><th>medium</th><th></th><th>nodes</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
  }

  // ------------------------------------------------------------------ visuals: inline SVG, nothing loaded from anywhere
  var PAL=['var(--accent)','var(--info)','#8a6fcf','var(--warn)'];
  function col(i){ return PAL[i%PAL.length]; }
  function svgo(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img">'; }
  function shortBytes(n){ if(n>=1e9) return (n/1e9).toFixed(n>=1e10?0:1)+' GB'; if(n>=1e6) return Math.round(n/1e6)+' MB'; if(n>=1e3) return Math.round(n/1e3)+' kB'; return Math.round(n)+' B'; }
  function gapOf(s){ return s.payer_bytes ? (s.hop_bytes-s.payer_bytes)/s.payer_bytes : 0; }
  function rateOf(s){ var d=s.t_last-s.t_first; return d>0 ? s.settled_bytes*8/d/1e6 : 0; }
  function linkOrder(X){ return Object.keys(X.links).sort(); }

  // The hour: the window being metered, then the minutes after it in which the books close.
  function hourTimeline(X, now){
    var R=X.R; if(!R.length) return '';
    var last=R[R.length-1].receipt, w0=last.t_first-(last.t_first%H), w1=w0+H;
    var cur=Math.floor(now/H)*H, isCur=(cur===w0);
    var W=960, Hh=76, L=10, Rm=10, split=W*0.62, after=600;
    var xw=function(t){ return L+Math.max(0,Math.min(1,(t-w0)/H))*(split-L); }, xa=function(t){ return split+12+Math.max(0,Math.min(1,(t-w1)/after))*(W-Rm-split-12); };
    var out=svgo(W,Hh);
    out+='<rect class="span" x="'+L+'" y="30" width="'+(split-L)+'" height="18"/><text class="lbl" x="'+L+'" y="22">the '+hm(w0)+' window, metered</text><text class="ax" x="'+split+'" y="22" text-anchor="end">'+hm(w1)+'</text>';
    out+='<rect class="span after" x="'+(split+12)+'" y="30" width="'+(W-Rm-split-12)+'" height="18"/><text class="lbl" x="'+(split+12)+'" y="22">the ten minutes after, in which the hour closes</text>';
    var ev=[], key=function(r){ return r.payer+'|'+r.hop+'|'+r.t_first; };
    R.filter(function(r){ return r.receipt.t_first>=w0 && r.receipt.t_first<w1; }).forEach(function(r){
      ev.push([r.received_at,'receipt from '+r.from,'']);
      var a=X.A.filter(function(a){ return key(a.receipt)===key(r.receipt); })[0]; if(a) ev.push([a.received_at,'ack from '+a.from,'']);
      var s=X.S.filter(function(s){ return key(s)===key(r.receipt); })[0]; if(s) ev.push([s.t,'settled '+bytes(s.settled_bytes)+(s.status==='disputed'?', disputed':''),'']);
    });
    X.C.filter(function(c){ return c.window===w0; }).forEach(function(c){ ev.push([c.t,'commitment, '+c.count+' settlement'+(c.count===1?'':'s'),'']); });
    if(D.steward&&D.steward.last_run&&D.steward.last_run>=w1&&D.steward.last_run<w1+after) ev.push([D.steward.last_run,'the Steward ran','steward']);
    ev.sort(function(a,b){ return a[0]-b[0]; });
    ev.forEach(function(e){ var x=e[0]<w1?xw(e[0]):xa(e[0]); out+='<line class="tick '+e[2]+'" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="28" y2="54"/>'; });
    if(now>=w0 && now<w1+after){ var xn=now<w1?xw(now):xa(now); out+='<line class="tick now" x1="'+xn.toFixed(1)+'" x2="'+xn.toFixed(1)+'" y1="24" y2="58"/><text class="ax" x="'+xn.toFixed(1)+'" y="70" text-anchor="middle">now</text>'; }
    out+='</svg>';
    var hms=function(s){ var d=new Date(s*1000); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
    var list=ev.length?'<table style="width:auto;margin-top:6px"><tbody>'+ev.map(function(e){ return '<tr><td class="m">'+hms(e[0])+'</td><td>'+esc(e[1])+'</td></tr>'; }).join('')+'</tbody></table>':'<p class="cap">nothing has happened in this window yet</p>';
    var next=isCur?('this window closes at '+hm(w1)+'; the receipt, the ack, the settlement and the commitment follow within seconds, the Steward at five past'):('the '+hm(cur)+' window is being metered now; its receipt is due at '+hm(cur+H));
    return '<h2>This hour <small>how a window becomes a settled, committed hour</small></h2><div class="chart">'+out+list+'<p class="cap">'+next+'.</p></div>';
  }

  // Seven days of traffic: settled bytes per hour, one colour per link, stacked; a disputed window is outlined.
  function trafficChart(X, now){
    var links=linkOrder(X); if(!links.length) return '';
    var end=Math.floor(now/H)*H, start=end-167*H, W=960, Hh=190, L=84, R=12, T=12, B=28;
    var by={}; links.forEach(function(k){ X.links[k].windows.forEach(function(s){ var h=Math.floor(s.t_first/H)*H; if(h<start||h>end) return; (by[h]=by[h]||{})[k]=s; }); });
    var max=1; Object.keys(by).forEach(function(h){ var tot=0; links.forEach(function(k){ if(by[h][k]) tot+=by[h][k].settled_bytes; }); if(tot>max) max=tot; });
    var x=function(h){ return L+(h-start)/(168*H)*(W-L-R); }, bw=(W-L-R)/168*0.9, y=function(v){ return T+(Hh-T-B)*(1-v/max); };
    var out=svgo(W,Hh);
    for(var g=1; g<=4; g++){ var v=max*g/4; out+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+shortBytes(v)+'</text>'; }
    for(var h=start; h<=end; h+=H){ var d=new Date(h*1000); if(d.getHours()===0){ out+='<line class="grid" x1="'+x(h).toFixed(1)+'" x2="'+x(h).toFixed(1)+'" y1="'+T+'" y2="'+(Hh-B)+'"/><text class="ax" x="'+(x(h)+3).toFixed(1)+'" y="'+(Hh-10)+'">'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'</text>'; } }
    Object.keys(by).forEach(function(h){ var acc=0; links.forEach(function(k,i){ var s=by[h][k]; if(!s) return; var top=y(acc+s.settled_bytes), bot=y(acc); out+='<rect class="bar'+(s.status==='disputed'?' disputed':'')+'" x="'+x(+h).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,bot-top).toFixed(1)+'" fill="'+col(i)+'"><title>'+tstamp(s.t_first)+' '+esc(X.name(s.payer))+' → '+esc(X.name(s.hop))+' '+bytes(s.settled_bytes)+' '+s.status+'</title></rect>'; acc+=s.settled_bytes; }); });
    out+='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+(Hh-B)+'" y2="'+(Hh-B)+'"/></svg>';
    var legend=links.map(function(k,i){ var l=X.links[k]; return '<i style="background:'+col(i)+'"></i>'+esc(X.name(l.payer))+' → '+esc(X.name(l.hop)); }).join('')+'<i style="background:transparent;border:1.5px solid var(--warn)"></i>disputed';
    return '<h2>Traffic <small>the last seven days, settled bytes per hour</small></h2><div class="chart">'+out+'<p class="cap legend">'+legend+'</p></div>';
  }

  // Per link: the gap between the two counts against the margin in force, and the rate against the purchase's minimum.
  function gapChart(l, margin){
    var Wd=sortBy(l.windows, function(s){ return s.t_first; }).slice(-96); if(Wd.length<2) return '';
    var W=440, Hh=130, L=46, R=8, T=10, B=24, raw=Wd.map(gapOf), gaps=raw.map(function(g){ return Math.max(-1, Math.min(1, g)); }), beyond=raw.filter(function(g){ return g>1||g<-1; }).length;
    var lo=Math.min(-margin*1.2, Math.min.apply(null,gaps)), hi=Math.max(margin*1.6, Math.max.apply(null,gaps)); if(hi-lo<0.01) hi=lo+0.01;
    var y=function(v){ return T+(Hh-T-B)*(1-(v-lo)/(hi-lo)); }, x=function(i){ return L+(i+0.5)/Wd.length*(W-L-R); };
    var sorted=raw.slice().sort(function(a,b){ return a-b; }), mean=sorted[Math.floor(sorted.length/2)];   // the median: forced tests and resets do not move it
    var out=svgo(W,Hh);
    out+='<rect class="band" x="'+L+'" y="'+y(margin).toFixed(1)+'" width="'+(W-L-R)+'" height="'+(y(-margin)-y(margin)).toFixed(1)+'"/>';
    [lo,0,margin,hi].forEach(function(v){ out+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(L-4)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+(v>0?'+':'')+pct(v,0)+'</text>'; });
    var W_=W;
    out+='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'"/><line class="mean" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(mean).toFixed(1)+'" y2="'+y(mean).toFixed(1)+'"/>';
    Wd.forEach(function(s,i){ var g=gapOf(s), c=Math.max(-1,Math.min(1,g)); out+='<circle class="dot '+s.status+'" cx="'+x(i).toFixed(1)+'" cy="'+y(c).toFixed(1)+'" r="'+(c!==g?4.5:3)+'"'+(c!==g?' stroke="var(--bad)" stroke-width="1.5"':'')+'><title>'+tstamp(s.t_first)+' '+(g>=0?'+':'')+pct(g)+' '+s.status+(c!==g?' (beyond the chart)':'')+'</title></circle>'; });
    out+='<text class="ax" x="'+L+'" y="'+(Hh-8)+'">'+tstamp(Wd[0].t_first)+'</text><text class="ax" x="'+(W-R)+'" y="'+(Hh-8)+'" text-anchor="end">'+tstamp(Wd[Wd.length-1].t_first)+'</text></svg>';
    return out+'<p class="cap">hop over payer per window; the band is the margin in force ('+pct(margin,0)+'), the dashed line the median ('+(mean>=0?'+':'')+pct(mean)+'); orange settled disputed'+(beyond?'; '+beyond+' window'+(beyond===1?'':'s')+' beyond ±100%, pinned at the edge':'')+'</p>';
  }
  function rateChart(l){
    var Wd=sortBy(l.windows, function(s){ return s.t_first; }).slice(-96); if(Wd.length<2) return '';
    var W=440, Hh=120, L=46, R=8, T=10, B=24, rates=Wd.map(rateOf), max=Math.max.apply(null,rates)||1;
    var pur=(D.purchases||[]).filter(function(p){ return p.program==='payer' && p.route.from===l.payer && p.route.to===l.hop && p.min_bytes; })[0];
    var minRate=pur ? pur.min_bytes*8/H/1e6 : null; if(minRate && minRate>max) max=minRate*1.1;
    var y=function(v){ return T+(Hh-T-B)*(1-v/max); }, x=function(i){ return L+i/Wd.length*(W-L-R); }, bw=(W-L-R)/Wd.length*0.8;
    var out=svgo(W,Hh);
    for(var g=1; g<=3; g++){ var v=max*g/3; out+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(L-4)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(v<1?2:1)+'</text>'; }
    Wd.forEach(function(s,i){ out+='<rect class="bar'+(s.status==='disputed'?' disputed':'')+'" x="'+x(i).toFixed(1)+'" y="'+y(rateOf(s)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,(Hh-B)-y(rateOf(s))).toFixed(1)+'"><title>'+tstamp(s.t_first)+' '+rateOf(s).toFixed(2)+' Mbit/s</title></rect>'; });
    if(minRate!=null) out+='<line class="min" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(minRate).toFixed(1)+'" y2="'+y(minRate).toFixed(1)+'"/>';
    out+='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+(Hh-B)+'" y2="'+(Hh-B)+'"/><text class="ax" x="'+L+'" y="'+(Hh-8)+'">Mbit/s, settled bytes over the window</text></svg>';
    return out+'<p class="cap">'+(minRate!=null?'the dotted line is the purchase\'s minimum, '+bytes(pur.min_bytes)+' a window ('+minRate.toFixed(2)+' Mbit/s); below it the premium is paid in proportion':'no purchase governs this link')+'</p>';
  }
  function linkCards(X, now){
    var out='', inForce={}; (X.st.links||[]).forEach(function(l){ inForce[l.relay]=l; });
    linkOrder(X).forEach(function(k,i){
      var l=X.links[k], m=inForce[l.hop]?inForce[l.hop].margin:0.01;
      var disputed=l.windows.filter(function(s){ return s.status==='disputed'; }).length;
      var paid=l.windows.reduce(function(a,s){ return a+(s.amount_usd||0); },0), fee=l.windows.reduce(function(a,s){ return a+(s.fee_usd||0); },0), gb=l.windows.reduce(function(a,s){ return a+s.settled_bytes; },0);
      out+='<div class="chart"><h3 style="margin:0 0 6px;font-size:15px"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+col(i)+';margin-right:6px"></i>'+esc(X.name(l.payer))+' → '+esc(X.name(l.hop))+' <small class="cap" style="display:inline">'+l.windows.length+' windows · '+bytes(gb)+' · '+disputed+' disputed · '+usd(paid)+' paid, '+usd(fee)+' of it the Steward\'s</small></h3>'+gapChart(l, m)+rateChart(l)+'</div>';
    });
    return out ? '<h2>Links <small>as settled, the last 96 windows of each</small></h2><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))">'+out+'</div>' : '';
  }

  // The chain of hours: one block per hour of the last three days.
  function chainChart(X, now){
    var end=Math.floor(now/H)*H-H, start=end-71*H, W=960, Hh=54, L=10, R=10, n=72, bw=(W-L-R)/n;
    var hours={}; X.S.forEach(function(s){ var w=Math.floor(s.t_first/H)*H; (hours[w]=hours[w]||[]).push(s); });
    var committed={}; X.C.forEach(function(c){ committed[c.window]=c; });
    var firstC=X.C.length?Math.min.apply(null, X.C.map(function(c){ return c.window; })):Infinity;
    var out=svgo(W,Hh), i=0;
    for(var h=start; h<=end; h+=H, i++){
      var c=committed[h], had=(hours[h]||[]).length, cls=c?'block':(had&&h>=firstC?'block missing':'block none'), x=L+i*bw;
      out+='<rect class="'+cls+'" x="'+(x+1).toFixed(1)+'" y="8" width="'+(bw-2).toFixed(1)+'" height="22" rx="2"><title>'+tstamp(h)+(c?': committed, '+c.count+' settlement'+(c.count===1?'':'s')+', root '+String(c.root).slice(0,12)+'…':had?': '+had+' settlement'+(had===1?'':'s')+', no commitment':': no settlement')+'</title></rect>';
      if(c&&c.count>1) out+='<text class="ax" x="'+(x+bw/2).toFixed(1)+'" y="23" text-anchor="middle" fill="var(--accent-ink)">'+c.count+'</text>';
      var d=new Date(h*1000); if(d.getHours()===0) out+='<text class="ax" x="'+(x+2).toFixed(1)+'" y="46">'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'</text>';
    }
    out+='</svg>';
    return '<div class="chart" style="margin-bottom:10px">'+out+'<p class="cap legend"><i style="background:var(--accent)"></i>committed hour, with its settlement count when more than one <i style="background:transparent;border:1.5px solid var(--bad)"></i>settled but not committed <i style="background:var(--line)"></i>nothing settled</p></div>';
  }

  // The map: each place is a card holding its nodes; the settled links run between the cards with their labels in chips;
  // the offers the Steward and payers have open sit below the row, where nothing else is drawn.
  function chip(x, y, text, cls, anchor){                                   // a label on a small plate, so lines never run through it
    var w=text.length*6.6+14, h=18, left=anchor==='start'?x:anchor==='end'?x-w:x-w/2; left=Math.max(4, Math.min(960-w-4, left));
    return '<g class="chip '+(cls||'')+'"><rect x="'+left.toFixed(1)+'" y="'+(y-13)+'" width="'+w.toFixed(1)+'" height="'+h+'" rx="4"/><text x="'+(left+w/2).toFixed(1)+'" y="'+y+'" text-anchor="middle">'+esc(text)+'</text></g>';
  }
  function mapChart(X, now){
    var m=D.map; if(!m||!m.places) return '';
    var ids=Object.keys(m.places), n=ids.length, W=960;
    var byPlace={}; for(var nd in (m.nodes||{})) (byPlace[m.nodes[nd]]=byPlace[m.nodes[nd]]||[]).push(nd);
    var maxNodes=Math.max(1, Math.max.apply(null, ids.map(function(id){ return (byPlace[id]||[]).length; })));
    var cw=Math.min(230, W/n-36), ch=60+18*maxNodes, top=92, cy=top+ch/2, bottom=top+ch;
    var cx=function(i){ return W*(i+0.5)/n; }, pos={}; ids.forEach(function(id,i){ pos[id]=i; });
    var placeOfNym=function(nym){ var nm=X.names[nym]; return nm && m.nodes ? m.nodes[nm] : null; };
    var P=(D.purchases||[]).filter(function(p){ return (!p.kind||p.kind==='purchase')&&p.deadline>=now&&!(X.closedAt&&X.closedAt[p.id]!=null&&X.closedAt[p.id]<=now); });   // open purchases only: not top-ups, closes or withdrawn ones
    var firstLinks={}; P.forEach(function(p){ if(p.program==='first_link') firstLinks[p.route.to]=(firstLinks[p.route.to]||0)+1; });
    var Hh=bottom+150, out=svgo(W,Hh), links='', labels='', offers='';
    // the settled links
    linkOrder(X).forEach(function(k,i){
      var l=X.links[k], a=placeOfNym(l.payer), b=placeOfNym(l.hop); if(a==null||b==null||pos[a]==null||pos[b]==null) return;
      var gb=l.windows.reduce(function(s,w){ return s+w.settled_bytes; },0), sw=Math.max(2, Math.min(10, 2+Math.log10(1+gb/1e6)*2)), text=X.name(l.payer)+' → '+X.name(l.hop)+' · '+bytes(gb);
      var pur=P.filter(function(p){ return p.program==='payer' && p.route.from===l.payer && p.route.to===l.hop; })[0];
      if(a===b){ var x=cx(pos[a]); links+='<path class="link" d="M'+(x-22)+' '+top+' C '+(x-34)+' '+(top-52)+', '+(x+34)+' '+(top-52)+', '+(x+22)+' '+top+'" stroke-width="'+sw.toFixed(1)+'" stroke="'+col(i)+'"><title>'+esc(text)+', inside '+esc(m.places[a].name)+'</title></path>'; labels+=chip(x, top-64, text+' · inside the place'); }
      else { var l0=Math.min(pos[a],pos[b]), l1=Math.max(pos[a],pos[b]), x1=cx(l0)+cw/2, x2=cx(l1)-cw/2, xm=(x1+x2)/2;
        if(l1-l0===1){ links+='<line class="link" x1="'+x1+'" y1="'+cy+'" x2="'+x2+'" y2="'+cy+'" stroke-width="'+sw.toFixed(1)+'" stroke="'+col(i)+'"><title>'+esc(text)+'</title></line><line class="grid" x1="'+xm+'" y1="'+(cy-4)+'" x2="'+xm+'" y2="'+(top-12)+'"/>'; labels+=chip(xm, top-20, text); if(pur) labels+=chip(xm, top-42, 'purchase · ≥ '+bytes(pur.min_bytes)+' a window · '+usd(pur.premium_per_gb)+'/GB · '+usd(pur.escrow)+' escrow', 'offer'); }
        else { var xa=cx(l0), xb=cx(l1), ya=top-10; links+='<path class="link" d="M'+xa+' '+top+' C '+xa+' '+(top-70)+', '+xb+' '+(top-70)+', '+xb+' '+top+'" stroke-width="'+sw.toFixed(1)+'" stroke="'+col(i)+'"><title>'+esc(text)+'</title></path>'; labels+=chip((xa+xb)/2, top-58, text); }
        if(pos[a]>pos[b]) links+='<text class="ax" x="'+(x1+6)+'" y="'+(cy+4)+'">◀</text>'; else links+='<text class="ax" x="'+(x2-14)+'" y="'+(cy+4)+'">▶</text>';
      }
    });
    // the offers, below the row
    P.forEach(function(p){
      var from = p.route.from==null ? null : (m.places[p.route.from]?p.route.from:placeOfNym(p.route.from)), to = m.places[p.route.to]?p.route.to:placeOfNym(p.route.to);
      if(p.program==='second_bridge' && from!=null && to!=null && pos[from]!=null && pos[to]!=null){ var xa=cx(pos[from])+cw*0.3, xb=cx(pos[to])-cw*0.3, y0=bottom+44, dip=bottom+130; offers+='<path class="offer" d="M'+xa+' '+(bottom+2)+' L '+xa+' '+y0+' C '+xa+' '+dip+', '+xb+' '+dip+', '+xb+' '+y0+' L '+xb+' '+(bottom+2)+'"><title>'+esc(p.id.slice(0,8))+': not via '+esc(p.route.not_via.join(', '))+'</title></path>'; offers+=chip((xa+xb)/2, bottom+112, 'second path wanted, through a third place · '+usd(p.escrow)+' at '+usd(p.premium_per_gb)+'/GB', 'offer'); }
    });
    // the cards
    var cards='';
    ids.forEach(function(id,i){ var pl=m.places[id], x=cx(i)-cw/2, nodes=byPlace[id]||[];
      cards+='<rect class="place'+(firstLinks[id]?' wanted':'')+'" x="'+x.toFixed(1)+'" y="'+top+'" width="'+cw.toFixed(1)+'" height="'+ch+'" rx="8"/>';
      cards+='<text class="lbl" x="'+(x+12)+'" y="'+(top+22)+'" font-weight="600">'+esc(pl.name||id)+'</text><text class="ax" x="'+(x+12)+'" y="'+(top+38)+'">'+esc(pl.medium)+' · '+esc(pl.range_class)+(pl.mapped?'':' · proposed')+'</text>';
      if(!nodes.length) cards+='<text class="ax" x="'+(x+12)+'" y="'+(top+60)+'">no node here yet</text>';
      nodes.forEach(function(nd,j){ var yy=top+60+j*18; cards+='<circle class="node" cx="'+(x+17)+'" cy="'+(yy-4)+'" r="4"/><text class="lbl m" x="'+(x+27)+'" y="'+yy+'">'+esc(nd)+'</text>'; });
      if(firstLinks[id]) cards+=chip(cx(i), bottom+22, 'first link wanted'+(firstLinks[id]>1?' · '+firstLinks[id]+' offers open':''), 'offer');
    });
    out+=links+offers+cards+labels+'</svg>';
    return '<h2>The map <small>places, the links that have settled, and the offers open on them</small></h2><div class="chart">'+out+'<p class="cap legend"><i style="background:var(--accent)"></i>a link, width by bytes carried <i style="background:transparent;border:2px dashed var(--info)"></i>an offer open on the map · places are accepted by Mint consensus, here the membership\'s file</p></div>';
  }

  // Money: the month so far per pair as a stacked bar, and the month's cumulative line by day.
  function moneyChart(X, now){
    var d=new Date(now*1000), month=d.getFullYear()+'-'+pad(d.getMonth()+1), by={}, days={};
    X.S.forEach(function(s){ var e=new Date(s.t_last*1000); if(e.getFullYear()+'-'+pad(e.getMonth()+1)!==month) return; var k=s.payer+'|'+s.hop; var o=by[k]=by[k]||{payer:s.payer,hop:s.hop,amount:0,fee:0,premium:0}; o.amount+=s.amount_usd||0; o.fee+=s.fee_usd||0; o.premium+=s.premium_usd||0; var dk=e.getDate(); days[dk]=(days[dk]||0)+(s.amount_usd||0)+(s.premium_usd||0); });
    var rows=Object.keys(by).map(function(k){ return by[k]; }); if(!rows.length) return '';
    var W=960, L=230, R=90, rh=26, Hh=rows.length*rh+16, max=Math.max.apply(null, rows.map(function(o){ return o.amount+o.premium; }))||1, sx=function(v){ return v/max*(W-L-R); };
    var out=svgo(W,Hh);
    rows.forEach(function(o,i){ var y=8+i*rh, x=L, relay=o.amount-o.fee; out+='<text class="lbl" x="'+(L-8)+'" y="'+(y+15)+'" text-anchor="end">'+esc(X.name(o.payer))+' pays '+esc(X.name(o.hop))+'</text>';
      [['relay',relay],['fee',o.fee],['premium',o.premium]].forEach(function(seg){ var w=sx(seg[1]); if(w>0){ out+='<rect class="seg '+seg[0]+'" x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="18"><title>'+seg[0]+' '+usd(seg[1])+'</title></rect>'; x+=w; } });
      out+='<text class="lbl m" x="'+(x+6).toFixed(1)+'" y="'+(y+14)+'">'+usd(o.amount+o.premium)+'</text>'; });
    out+='</svg>';
    var last=d.getDate(), cum=0, pts=[], W2=960, H2=120, L2=70, R2=12, T2=10, B2=24, tot=Object.keys(days).reduce(function(a,k){ return a+days[k]; },0)||1;
    var xd=function(day){ return L2+(day-1)/Math.max(1,last-1)*(W2-L2-R2); }, yd=function(v){ return T2+(H2-T2-B2)*(1-v/tot); };
    for(var day=1; day<=last; day++){ cum+=days[day]||0; pts.push(xd(day).toFixed(1)+','+yd(cum).toFixed(1)); }
    var line=svgo(W2,H2);
    [0.5,1].forEach(function(f){ line+='<line class="grid" x1="'+L2+'" x2="'+(W2-R2)+'" y1="'+yd(tot*f).toFixed(1)+'" y2="'+yd(tot*f).toFixed(1)+'"/><text class="ax" x="'+(L2-6)+'" y="'+(yd(tot*f)+4).toFixed(1)+'" text-anchor="end">'+usd(tot*f)+'</text>'; });
    line+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts.join(' ')+'"/>';
    [1,last].forEach(function(day){ line+='<text class="ax" x="'+xd(day).toFixed(1)+'" y="'+(H2-8)+'" text-anchor="'+(day===1?'start':'end')+'">'+month+'-'+pad(day)+'</text>'; });
    line+='</svg>';
    return '<h2>Money <small>'+month+', the month so far</small></h2><div class="chart">'+out+'<p class="cap legend"><i style="background:var(--accent)"></i>the relay\'s share <i style="background:var(--warn)"></i>the Steward\'s fee <i style="background:var(--info)"></i>premiums on purchases</p></div><div class="chart" style="margin-top:10px">'+line+'<p class="cap">paid for carriage and premiums, cumulative by day</p></div>';
  }

  // ------------------------------------------------------------------ draw
  function draw(){
    var now = D.snapshot ? D.fetchedAt : Math.floor(Date.now()/1000);
    NOW=now; var X = derive(), st=X.st;
    $('h-name').textContent = st.name||'bwkit'; $('h-role').textContent = st.role||'node'; $('h-nym').textContent = st.nym||''; $('h-ver').textContent = st.impl||(st.bwkit?'bwkit/'+st.bwkit:'');
    $('h-at').textContent = (D.snapshot?'taken ':'read ')+tstamp(D.fetchedAt); $('h-snap').hidden = !D.snapshot;
    document.title = (st.name||'bwkit')+' · '+(st.role||'node');
    var parts=[nowStrip(X, now), attention(X, now), hourTimeline(X, now), pendingTable(X, now), trafficChart(X, now), linkCards(X, now), windowsTable(X), commitmentsTable(X), mapChart(X, now), peersTable(X, now), linksAnnounced(X), purchasesTable(X, now), stewardCard(X, now), moneyChart(X, now), invoiceTable(X, now), mapCard()];
    $('sections').innerHTML = parts.join('');
  }

  function start(){
    if(loadSnapshot()){ draw(); return; }
    loadLive().then(function(){ $('err').hidden=true; draw(); }, function(e){ $('err').hidden=false; $('err').textContent='Could not read the node: '+e.message+'. This page is served by bwkit itself; open it at the node\'s address and port.'; });
    setInterval(function(){ loadLive().then(draw, function(){}); }, 60000);
  }
  start();
})();
</script>
