# A cabin in the forest, without the Steward's match (m = 0): the same run as cabin.toml otherwise.
#
# Six kilometres past the end of the street, through trees, a cabin with no connection posts
# a purchase commitment with the street's Mint: a route from the cabin to House 3's dish, at
# least a gigabyte an hour, a premium of ten cents a gigabyte over the posted prices, 720
# hourly windows, a deadline of sixty days (window 1440), and a proving allowance of ten
# windows a week. 720 windows × 1 GB × ($0.15 posted + $0.10 premium) = $180 escrowed. The
# Steward matches m of it. Nobody builds for two days. At window 48 a neighbour puts a relay
# on the ridge, 3 km each way at $0.05/GB; House 3's dish is $0.10/GB. A full window of
# 1.2 GB draws 30¢ from the escrow (6¢ + 6¢ premium to the ridge, 12¢ + 6¢ to House 3,
# 1.5¢ of it to the Steward). Rain at windows 60–63 moves 0.5 GB: 12.5¢ paid, 5¢ of premium
# back to the cabin. A hiker tries the route at windows 72–74 and the escrow reimburses the
# hiker's posted price. The relay is dark for a day from window 96, and for good from
# window 480; at the deadline the unspent escrow returns to the cabin and to the Steward.

[scenario]
name = "A cabin in the forest, no match"
description = "m = 0, so the Steward matches nothing. The cabin posts a $180 bounty at window 0; a neighbour builds the ridge relay at window 48; rain, a hiker, a dark day, then dark for good; the deadline at window 1440."
windows = 1464
window_seconds = 3600
report = "phase"
detail_windows = [48, 60, 72, 1440]

[params]
f = 0.05
m = 0
program_window = 24
first_link_size = 2.00
first_link_premium = 0.05
bounty_deadline = 168

[steward]
opening_escrow = { street = 200.00 }   # fees the street's Steward has taken so far; the match may not exceed m of its income

