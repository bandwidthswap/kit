# A street with three dishes (the field note's first map).
#
# Three houses each sell a satellite uplink at $0.10/GB to one dependent house, by wire.
# Wi-Fi joins House 1 and House 2, a 915 MHz radio joins House 2 and House 3, and each
# house charges $0.02/GB to carry a neighbour's traffic across its street link. The Mint
# is a Raspberry Pi at House 2 and the receipts are hourly. Day one everything works and
# the street links carry nothing. At window 24 snow takes House 1's dish down: House 1a's
# bytes cross the Wi-Fi to House 2's dish and House 1a pays both houses; House 1 pays
# House 2 for its own twenty gigabytes. The field note's figures: working, House 1 and 2
# earn $2.85 a day and House 3 $0.95; down, House 2 earns $7.60, House 1 earns 57¢ and
# pays $2.00. At the end of day two the Steward's rule sees the Wi-Fi as a sole bridge
# carrying fees and posts its take of those fees (3¢) as a bounty for a second path through
# another place.

[scenario]
name = "A street with three dishes"
description = "Three one-hop markets on day 1; House 1's dish goes down at window 24 and House 1a's bytes take the Wi-Fi to House 2's dish."
windows = 48
window_seconds = 3600
report = "phase"

[params]
f = 0.05
m = 0.025
program_window = 24
reconcile_every = 24

